<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיחה בלחיצה</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFE15A">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #FFE15A;
    --paper: #FFFFFF;
    --ink: #2B1E4A;
    --ink-soft: #4A3D6B;
    --red: #F23D2F;
    --blue: #2E9BFF;
    --error: #C0261B;
    --error-bg: #FFE8EC;
    --hint: #756B92;
    --purple: #8B5CF6;
    --ui: "Fredoka", system-ui, sans-serif;
    --hand: "Playpen Sans Hebrew", "Fredoka", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--sun);
    background-image: url("assets/bg-doodles.svg"), url("assets/bg-dots.svg");
    background-repeat: no-repeat, repeat;
    background-position: top center, 0 0;
    color: var(--ink);
    font-family: var(--ui);
  }

  main {
    max-width: 440px;
    margin: 0 auto;
    padding: 28px 18px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .logo { display: block; width: 300px; max-width: 100%; height: auto; margin: 0 auto; }

  .intro {
    margin: 0;
    text-align: center;
    color: var(--ink-soft);
    font-size: 17px;
    font-weight: 500;
  }

  form { display: flex; flex-direction: column; gap: 14px; }

  label { font-size: 18px; font-weight: 600; }

  input[type="text"] {
    width: 100%;
    padding: 12px 16px;
    font: 500 19px var(--ui);
    color: var(--ink);
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 18px;
    box-shadow: 4px 4px 0 var(--ink);
    transform: rotate(0.6deg);
  }
  input[type="text"]::placeholder { color: var(--hint); opacity: 1; }
  input[type="text"]:focus { outline: 4px solid var(--blue); outline-offset: 2px; }

  button {
    min-height: 64px;
    width: 100%;
    font: 700 24px var(--ui);
    color: #fff;
    background: var(--red);
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: 0 8px 0 var(--ink);
    transform: rotate(-1deg);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  button:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }
  button:active,
  button:disabled {
    transform: translateY(6px) rotate(-1deg);
    box-shadow: 0 2px 0 var(--ink);
  }
  button:disabled { cursor: wait; }

  .bubble {
    position: relative;
    min-height: 190px;
    margin-top: 14px;
    padding: 20px 18px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 28px;
    box-shadow: 6px 6px 0 var(--ink);
    transform: rotate(-1.2deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
  }
  .bubble[data-state="error"] { background: var(--error-bg); }

  .mascot { display: none; width: 118px; height: auto; }
  .bubble[data-state="idle"] .mascot-idle,
  .bubble[data-state="think"] .mascot-think,
  .bubble[data-state="joke"] .mascot-joke,
  .bubble[data-state="error"] .mascot-error { display: block; }

  .bubble[data-state="joke"] .mascot-joke {
    position: absolute;
    top: -34px;
    right: -14px;
    width: 86px;
    transform: rotate(8deg);
    animation: laugh 1.6s ease-in-out 1 both;
  }
  .bubble[data-state="idle"] .mascot-idle { animation: bob 2.4s ease-in-out infinite; }
  .bubble[data-state="think"] .mascot-think { animation: squash .5s ease-in-out infinite; }
  .bubble[data-state="error"] .mascot-error { animation: sway .8s ease-in-out 2; }

  @keyframes bob { 50% { transform: translateY(-5px); } }
  @keyframes squash { 50% { transform: scale(.86); } }
  @keyframes laugh {
    from { transform: rotate(8deg); }
    to { transform: rotate(1448deg); }
  }
  @keyframes sway { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }

  #msg { margin: 0; font-size: 17px; font-weight: 500; color: var(--ink-soft); }
  .bubble[data-state="think"] #msg { color: var(--ink); }
  .bubble[data-state="error"] #msg { color: var(--error); font-weight: 600; }
  .bubble[data-state="joke"] #msg {
    font: 500 25px/1.55 var(--hand);
    color: var(--ink);
    padding-top: 8px;
    overflow-wrap: anywhere;
  }

  .laugh-btn {
    width: auto;
    min-height: 48px;
    padding-inline: 22px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font: 600 18px var(--ui);
    color: var(--ink);
    background: var(--sun);
    box-shadow: 0 5px 0 var(--ink);
  }
  .laugh-btn[hidden], .laugh-error[hidden], .top[hidden] { display: none; }
  .laugh-btn:active,
  .laugh-btn:disabled {
    transform: translateY(3px) rotate(-1deg);
    box-shadow: 0 2px 0 var(--ink);
  }
  .laugh-btn:disabled { background: var(--paper); cursor: default; }
  .laugh-count { font-weight: 700; }
  .laugh-error { margin: 0; font-size: 15px; font-weight: 600; color: var(--error); }

  .top {
    margin-top: 10px;
    padding: 16px 18px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 4px 4px 0 var(--ink);
    transform: rotate(0.6deg);
  }
  .top h2 { margin: 0 0 10px; font-size: 22px; font-weight: 700; text-align: center; }
  .top ol { margin: 0; padding-inline-start: 24px; display: flex; flex-direction: column; gap: 12px; }
  .top-text { display: block; font: 500 18px/1.5 var(--hand); overflow-wrap: anywhere; }
  .top-laughs { display: block; font-size: 14px; font-weight: 600; color: var(--ink-soft); }

  footer {
    margin-top: 6px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .for-you { margin: 0; font-size: 15px; font-weight: 500; color: var(--ink-soft); }

  /* Account button (Milestone 5): a white sticker at the top, on the left in RTL. */
  .topbar { display: flex; justify-content: flex-end; margin-bottom: -4px; }
  .account-btn {
    width: auto;
    max-width: 100%;
    min-height: 46px;
    padding-block: 4px;
    padding-inline: 18px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font: 600 17px var(--ui);
    color: var(--ink);
    background: var(--paper);
    box-shadow: 4px 4px 0 var(--ink);
    transform: rotate(-2deg);
  }
  .account-btn.signed-in { padding-inline-start: 5px; }
  .account-btn:active,
  .account-btn:disabled {
    transform: translate(2px, 2px) rotate(-2deg);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .account-name { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avatar {
    flex: none;
    width: 34px;
    height: 34px;
    display: inline-grid;
    place-items: center;
    font: 700 17px var(--ui);
    color: #fff;
    background: var(--purple);
    border: 2.5px solid var(--ink);
    border-radius: 50%;
  }
  .avatar-big { width: 64px; height: 64px; font-size: 30px; border-width: 3px; margin: 0 auto; }

  /* Dialogs (Milestone 5): rise from the bottom on a phone, centered on a computer. */
  dialog.sheet {
    width: calc(100% - 20px);
    max-width: 440px;
    max-height: calc(100% - 20px);
    margin: auto auto 10px;
    padding: 0;
    overflow: auto;
    color: var(--ink);
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 26px;
    box-shadow: 6px 6px 0 var(--ink);
  }
  dialog.sheet[open] { animation: rise .28s ease-out; }
  dialog.sheet::backdrop { background: rgb(43 30 74 / 0.45); }
  @keyframes rise { from { transform: translateY(60px); opacity: 0; } }
  @media (min-width: 600px) {
    dialog.sheet { margin: auto; }
  }

  .sheet-body { position: relative; padding: 24px 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .sheet-body h2 { margin: 0; font-size: 24px; font-weight: 700; text-align: center; }
  .sheet-note { margin: 0; text-align: center; color: var(--ink-soft); font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }

  .sheet-close {
    position: absolute;
    inset-block-start: 10px;
    inset-inline-end: 10px;
    width: 40px;
    height: 40px;
    min-height: 40px;
    padding: 0;
    font: 700 22px/1 var(--ui);
    color: var(--ink);
    background: var(--paper);
    border-width: 2.5px;
    box-shadow: 2px 2px 0 var(--ink);
    transform: none;
  }
  .sheet-close:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }

  .seg {
    display: flex;
    gap: 4px;
    padding: 4px;
    margin-top: 4px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .seg button {
    flex: 1;
    min-height: 42px;
    font: 600 17px var(--ui);
    color: var(--ink);
    background: transparent;
    border: 0;
    box-shadow: none;
    transform: none;
  }
  .seg button[aria-pressed="true"] { color: #fff; background: var(--ink); }
  .seg button:active { transform: none; box-shadow: none; }

  .auth-form { display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 16px; font-weight: 600; }
  .field input {
    width: 100%;
    padding: 10px 14px;
    font: 500 18px var(--ui);
    color: var(--ink);
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 3px 3px 0 var(--ink);
    transform: none;
  }
  .field input:focus { outline: 4px solid var(--blue); outline-offset: 2px; }

  .form-error {
    margin: 0;
    padding: 10px 12px;
    font-size: 16px;
    font-weight: 600;
    color: var(--error);
    background: var(--error-bg);
    border: 2px solid var(--error);
    border-radius: 12px;
  }

  .sheet .primary { min-height: 56px; font-size: 21px; margin-top: 4px; }
  .secondary {
    min-height: 52px;
    font: 600 18px var(--ui);
    color: var(--ink);
    background: var(--paper);
    box-shadow: 0 5px 0 var(--ink);
    transform: none;
  }
  .secondary:active,
  .secondary:disabled { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .danger { color: var(--error); }
  .danger-solid { color: #fff; background: var(--error); }
  .stack { display: flex; flex-direction: column; gap: 12px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header class="topbar">
    <button class="account-btn" id="account-btn" type="button" aria-haspopup="dialog">
      <span class="avatar" id="account-avatar" aria-hidden="true" hidden></span>
      <span class="account-name" id="account-label">כניסה</span>
    </button>
  </header>

  <img class="logo" src="assets/logo.svg" alt="בדיחה בלחיצה">
  <p class="intro">כותבים נושא, לוחצים, וצוחקים. בלי נושא, מקבלים בדיחה כללית.</p>

  <form id="form">
    <label for="topic">על מה הבדיחה?</label>
    <input id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים" autocomplete="off">
    <button id="go" type="submit">תנו לי בדיחה!</button>
  </form>

  <section class="bubble" id="bubble" data-state="idle">
    <img class="mascot mascot-idle" src="assets/mascot-idle.svg" alt="">
    <img class="mascot mascot-think" src="assets/mascot-think.svg" alt="">
    <img class="mascot mascot-joke" src="assets/mascot-joke.svg" alt="">
    <img class="mascot mascot-error" src="assets/mascot-error.svg" alt="">
    <p id="msg" aria-live="polite">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
    <p class="for-you" id="for-you" hidden></p>
    <button class="laugh-btn" id="laugh" type="button" hidden>צחקתי <span class="laugh-count" id="laugh-count">0</span></button>
    <p class="laugh-error" id="laugh-error" role="status" hidden></p>
  </section>

  <section class="top" id="top" hidden>
    <h2>הכי מצחיקות</h2>
    <ol id="top-list"></ol>
  </section>

  <footer>מיישם AI ואוטומציה · 53500</footer>
</main>

<dialog class="sheet" id="login-dialog" aria-labelledby="login-title">
  <div class="sheet-body">
    <button class="sheet-close" type="button" data-close aria-label="סגירה">×</button>
    <h2 id="login-title">כניסה</h2>
    <div class="seg" role="group" aria-label="כניסה או הרשמה">
      <button type="button" id="mode-signin" aria-pressed="true">כניסה</button>
      <button type="button" id="mode-signup" aria-pressed="false">הרשמה</button>
    </div>
    <form class="auth-form" id="login-form" novalidate>
      <div class="field" id="name-field" hidden>
        <label for="login-name">איך לקרוא לך?</label>
        <input id="login-name" type="text" maxlength="30" autocomplete="nickname" dir="auto">
      </div>
      <div class="field">
        <label for="login-email">מייל</label>
        <input id="login-email" type="email" dir="ltr" autocomplete="email" inputmode="email" spellcheck="false">
      </div>
      <div class="field">
        <label for="login-password">סיסמה</label>
        <input id="login-password" type="password" dir="ltr" minlength="6" autocomplete="current-password">
      </div>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="primary" id="login-submit" type="submit">להתחבר</button>
    </form>
  </div>
</dialog>

<dialog class="sheet" id="account-dialog" aria-labelledby="account-name">
  <div class="sheet-body">
    <button class="sheet-close" type="button" data-close aria-label="סגירה">×</button>
    <span class="avatar avatar-big" id="account-avatar-big" aria-hidden="true"></span>
    <h2 id="account-name"></h2>
    <p class="sheet-note" id="account-email" dir="ltr"></p>
    <div class="stack" id="account-main">
      <button class="secondary" id="logout" type="button">התנתקות</button>
      <button class="secondary danger" id="delete-start" type="button">מחיקת חשבון</button>
    </div>
    <div class="stack" id="account-confirm" hidden>
      <p class="sheet-note">בטוח? החשבון יימחק לתמיד. הבדיחות שלך יישארו, בלי השם שלך.</p>
      <button class="secondary danger-solid" id="delete-confirm" type="button">כן, למחוק את החשבון</button>
      <button class="secondary" id="delete-cancel" type="button">ביטול</button>
    </div>
    <p class="form-error" id="account-error" role="alert" hidden></p>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js" integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
<script src="/auth.js"></script>

<script>
  const form = document.getElementById("form");
  const topicInput = document.getElementById("topic");
  const go = document.getElementById("go");
  const bubble = document.getElementById("bubble");
  const msg = document.getElementById("msg");
  const laugh = document.getElementById("laugh");
  const laughCount = document.getElementById("laugh-count");
  const laughError = document.getElementById("laugh-error");
  const topSection = document.getElementById("top");
  const topList = document.getElementById("top-list");
  const forYou = document.getElementById("for-you");

  const accountBtn = document.getElementById("account-btn");
  const accountAvatar = document.getElementById("account-avatar");
  const accountLabel = document.getElementById("account-label");

  const loginDialog = document.getElementById("login-dialog");
  const loginTitle = document.getElementById("login-title");
  const modeSignin = document.getElementById("mode-signin");
  const modeSignup = document.getElementById("mode-signup");
  const loginForm = document.getElementById("login-form");
  const nameField = document.getElementById("name-field");
  const nameInput = document.getElementById("login-name");
  const emailInput = document.getElementById("login-email");
  const passwordInput = document.getElementById("login-password");
  const loginError = document.getElementById("login-error");
  const loginSubmit = document.getElementById("login-submit");

  const accountDialog = document.getElementById("account-dialog");
  const accountAvatarBig = document.getElementById("account-avatar-big");
  const accountName = document.getElementById("account-name");
  const accountEmail = document.getElementById("account-email");
  const accountMain = document.getElementById("account-main");
  const accountConfirm = document.getElementById("account-confirm");
  const logoutBtn = document.getElementById("logout");
  const deleteStart = document.getElementById("delete-start");
  const deleteConfirm = document.getElementById("delete-confirm");
  const deleteCancel = document.getElementById("delete-cancel");
  const accountError = document.getElementById("account-error");

  const RELOGIN = "צריך להתחבר שוב.";
  const GENERAL = "משהו השתבש. נסו שוב בעוד רגע.";

  let currentJokeId = null;
  let topRequest = 0;
  let loginMode = "signin";

  // Every call to /api goes through here, with the token when there is one.
  // A 401 with auth_required on a call that carried a token: sign out on the spot.
  async function api(path, options = {}) {
    const headers = new Headers(options.headers || {});
    const token = window.Auth ? await Auth.token() : null;
    if (token) headers.set("Authorization", `Bearer ${token}`);

    const res = await fetch(path, { ...options, headers });
    let data = {};
    try {
      data = (await res.json()) ?? {};
    } catch {
      data = {};
    }

    if (token && res.status === 401 && data.code === "auth_required") {
      await Auth.signOut();
      renderAccount(null);
      data = { ...data, error: RELOGIN };
    }
    return { res, data };
  }

  function setState(state, text, label, jokeId = null, authorName = null) {
    bubble.dataset.state = state;
    msg.textContent = text;
    go.textContent = label;
    go.disabled = state === "think";

    forYou.textContent = authorName ? `נכתבה עכשיו בשבילך, ${authorName}` : "";
    forYou.hidden = !authorName;

    // A joke that was not saved has no id, so there is nothing to count.
    currentJokeId = jokeId;
    laugh.hidden = !jokeId;
    laugh.disabled = false;
    laughCount.textContent = "0";
    laughError.hidden = true;
  }

  function renderTop(jokes) {
    topList.replaceChildren(...jokes.map((joke) => {
      const item = document.createElement("li");
      const text = document.createElement("span");
      text.className = "top-text";
      text.textContent = joke.text;
      const laughs = document.createElement("span");
      laughs.className = "top-laughs";
      laughs.textContent = joke.laughs === 1 ? "צחוק אחד" : `${joke.laughs} צחוקים`;
      item.append(text, laughs);
      return item;
    }));
    topSection.hidden = jokes.length === 0;
  }

  async function loadTop() {
    const request = ++topRequest;
    try {
      const { res, data } = await api("/api/top");
      if (request === topRequest && res.ok && Array.isArray(data.top)) renderTop(data.top);
    } catch (err) {
      console.error(err);
    }
  }

  laugh.addEventListener("click", async () => {
    const id = currentJokeId;
    laugh.disabled = true;
    laughError.hidden = true;

    let laughs = null;
    let problem = "לא הצלחנו לספור את הצחוק. נסו שוב.";
    try {
      const { res, data } = await api("/api/laugh", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id }),
      });
      if (res.ok && Number.isInteger(data.laughs)) laughs = data.laughs;
      else if (typeof data.error === "string" && data.error) problem = data.error;
    } catch (err) {
      console.error(err);
    }

    // The user may have moved on to a new joke while this was in flight.
    if (id === currentJokeId) {
      if (laughs === null) {
        laugh.disabled = false;
        laughError.textContent = problem;
        laughError.hidden = false;
      } else {
        laughCount.textContent = String(laughs);
      }
    }
    if (laughs !== null) loadTop();
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const topic = topicInput.value.trim().slice(0, 100);

    setState("think", topic ? `מחפש בדיחה על ${topic}...` : "מחפש בדיחה...", "חושב...");

    try {
      const { res, data } = await api("/api/joke", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic }),
      });
      if (res.ok && typeof data.joke === "string") {
        const author = typeof data.author_name === "string" && data.author_name ? data.author_name : null;
        setState("joke", data.joke, "עוד בדיחה!", data.id, author);
        return;
      }
      const text = typeof data.error === "string" && data.error ? data.error : GENERAL;
      setState("error", text, "לנסות שוב");
    } catch (err) {
      console.error(err);
      setState("error", GENERAL, "לנסות שוב");
    }
  });

  // ---- Account ----

  function userInfo(session) {
    const user = session?.user;
    if (!user) return null;
    const meta = typeof user.user_metadata?.full_name === "string" ? user.user_metadata.full_name.trim() : "";
    const name = meta ? Array.from(meta).slice(0, 30).join("") : (user.email || "").split("@")[0];
    return { name, email: user.email || "", initial: Array.from(name)[0] || "?" };
  }

  function renderAccount(session) {
    const info = userInfo(session);
    accountBtn.classList.toggle("signed-in", Boolean(info));
    accountAvatar.hidden = !info;
    accountAvatar.textContent = info ? info.initial : "";
    accountLabel.textContent = info ? info.name : "כניסה";
    if (info) accountBtn.setAttribute("aria-label", `החשבון שלי: ${info.name}`);
    else accountBtn.removeAttribute("aria-label");
    if (!info && accountDialog.open) accountDialog.close();
  }

  function showError(element, text) {
    element.textContent = text;
    element.hidden = !text;
  }

  function setLoginMode(mode) {
    loginMode = mode;
    const signup = mode === "signup";
    modeSignin.setAttribute("aria-pressed", String(!signup));
    modeSignup.setAttribute("aria-pressed", String(signup));
    nameField.hidden = !signup;
    passwordInput.autocomplete = signup ? "new-password" : "current-password";
    loginTitle.textContent = signup ? "הרשמה" : "כניסה";
    loginSubmit.textContent = signup ? "להירשם" : "להתחבר";
    showError(loginError, "");
  }

  function openLogin() {
    passwordInput.value = "";
    showError(loginError, "");
    loginSubmit.disabled = false;
    loginDialog.showModal();
    (loginMode === "signup" ? nameInput : emailInput).focus();
    Auth.ready().catch((err) => {
      console.error(err);
      showError(loginError, "הכניסה לא זמינה כרגע. נסו שוב בעוד רגע.");
    });
  }

  function openAccount() {
    const info = userInfo(Auth.session());
    if (!info) return openLogin();
    accountAvatarBig.textContent = info.initial;
    accountName.textContent = info.name;
    accountEmail.textContent = info.email;
    accountMain.hidden = false;
    accountConfirm.hidden = true;
    showError(accountError, "");
    setAccountBusy(false);
    accountDialog.showModal();
  }

  function setAccountBusy(busy) {
    for (const button of [logoutBtn, deleteStart, deleteConfirm, deleteCancel]) button.disabled = busy;
  }

  accountBtn.addEventListener("click", () => {
    if (Auth.session()) openAccount();
    else openLogin();
  });

  modeSignin.addEventListener("click", () => setLoginMode("signin"));
  modeSignup.addEventListener("click", () => {
    setLoginMode("signup");
    nameInput.focus();
  });

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    loginSubmit.disabled = true;
    showError(loginError, "");

    const result = loginMode === "signup"
      ? await Auth.signUp(nameInput.value, emailInput.value, passwordInput.value)
      : await Auth.signIn(emailInput.value, passwordInput.value);

    loginSubmit.disabled = false;
    if (result.error) {
      showError(loginError, result.error);
      return;
    }
    passwordInput.value = "";
    loginDialog.close();
    renderAccount(Auth.session());
  });

  logoutBtn.addEventListener("click", async () => {
    setAccountBusy(true);
    await Auth.signOut();
    accountDialog.close();
    renderAccount(null);
  });

  deleteStart.addEventListener("click", () => {
    accountMain.hidden = true;
    accountConfirm.hidden = false;
    showError(accountError, "");
    deleteCancel.focus();
  });

  deleteCancel.addEventListener("click", () => {
    accountConfirm.hidden = true;
    accountMain.hidden = false;
    showError(accountError, "");
    deleteStart.focus();
  });

  deleteConfirm.addEventListener("click", async () => {
    setAccountBusy(true);
    showError(accountError, "");
    try {
      const { res, data } = await api("/api/delete-account", { method: "POST" });
      if (res.ok && data.deleted === true) {
        await Auth.signOut();
        accountDialog.close();
        renderAccount(null);
        return;
      }
      showError(accountError, typeof data.error === "string" && data.error ? data.error : GENERAL);
    } catch (err) {
      console.error(err);
      showError(accountError, GENERAL);
    }
    setAccountBusy(false);
  });

  // Close buttons, and a click on the backdrop (outside the sheet). Escape is built in.
  for (const dialog of [loginDialog, accountDialog]) {
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog || event.target.closest("[data-close]")) dialog.close();
    });
  }

  if (window.Auth) {
    Auth.onChange((session) => renderAccount(session));
    Auth.ready()
      .then(() => renderAccount(Auth.session()))
      .catch((err) => console.error(err));
  }

  loadTop();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch((err) => console.error(err));
  }
</script>
</body>
</html>
