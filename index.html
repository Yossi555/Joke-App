<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיחה בלחיצה</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFE15A">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #FFE15A;
    --paper: #FFFFFF;
    --ink: #2B1E4A;
    --ink-soft: #4A3D6B;
    --red: #F23D2F;
    --blue: #2E9BFF;
    --error: #C0261B;
    --error-bg: #FFE8EC;
    --hint: #756B92;
    --ui: "Fredoka", system-ui, sans-serif;
    --hand: "Playpen Sans Hebrew", "Fredoka", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--sun);
    background-image: url("assets/bg-doodles.svg"), url("assets/bg-dots.svg");
    background-repeat: no-repeat, repeat;
    background-position: top center, 0 0;
    color: var(--ink);
    font-family: var(--ui);
  }

  main {
    max-width: 440px;
    margin: 0 auto;
    padding: 28px 18px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .logo { display: block; width: 300px; max-width: 100%; height: auto; margin: 0 auto; }

  .intro {
    margin: 0;
    text-align: center;
    color: var(--ink-soft);
    font-size: 17px;
    font-weight: 500;
  }

  form { display: flex; flex-direction: column; gap: 14px; }

  label { font-size: 18px; font-weight: 600; }

  input[type="text"] {
    width: 100%;
    padding: 12px 16px;
    font: 500 19px var(--ui);
    color: var(--ink);
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 18px;
    box-shadow: 4px 4px 0 var(--ink);
    transform: rotate(0.6deg);
  }
  input[type="text"]::placeholder { color: var(--hint); opacity: 1; }
  input[type="text"]:focus { outline: 4px solid var(--blue); outline-offset: 2px; }

  button {
    min-height: 64px;
    width: 100%;
    font: 700 24px var(--ui);
    color: #fff;
    background: var(--red);
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: 0 8px 0 var(--ink);
    transform: rotate(-1deg);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  button:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }
  button:active,
  button:disabled {
    transform: translateY(6px) rotate(-1deg);
    box-shadow: 0 2px 0 var(--ink);
  }
  button:disabled { cursor: wait; }

  .bubble {
    position: relative;
    min-height: 190px;
    margin-top: 14px;
    padding: 20px 18px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 28px;
    box-shadow: 6px 6px 0 var(--ink);
    transform: rotate(-1.2deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
  }
  .bubble[data-state="error"] { background: var(--error-bg); }

  .mascot { display: none; width: 118px; height: auto; }
  .bubble[data-state="idle"] .mascot-idle,
  .bubble[data-state="think"] .mascot-think,
  .bubble[data-state="joke"] .mascot-joke,
  .bubble[data-state="error"] .mascot-error { display: block; }

  .bubble[data-state="joke"] .mascot-joke {
    position: absolute;
    top: -34px;
    right: -14px;
    width: 86px;
    transform: rotate(8deg);
    animation: laugh 1.6s ease-in-out 1 both;
  }
  .bubble[data-state="idle"] .mascot-idle { animation: bob 2.4s ease-in-out infinite; }
  .bubble[data-state="think"] .mascot-think { animation: squash .5s ease-in-out infinite; }
  .bubble[data-state="error"] .mascot-error { animation: sway .8s ease-in-out 2; }

  @keyframes bob { 50% { transform: translateY(-5px); } }
  @keyframes squash { 50% { transform: scale(.86); } }
  @keyframes laugh {
    from { transform: rotate(8deg); }
    to { transform: rotate(1448deg); }
  }
  @keyframes sway { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }

  #msg { margin: 0; font-size: 17px; font-weight: 500; color: var(--ink-soft); }
  .bubble[data-state="think"] #msg { color: var(--ink); }
  .bubble[data-state="error"] #msg { color: var(--error); font-weight: 600; }
  .bubble[data-state="joke"] #msg {
    font: 500 25px/1.55 var(--hand);
    color: var(--ink);
    padding-top: 8px;
    overflow-wrap: anywhere;
  }

  .laugh-btn {
    width: auto;
    min-height: 48px;
    padding-inline: 22px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font: 600 18px var(--ui);
    color: var(--ink);
    background: var(--sun);
    box-shadow: 0 5px 0 var(--ink);
  }
  .laugh-btn[hidden], .laugh-error[hidden], .top[hidden] { display: none; }
  .laugh-btn:active,
  .laugh-btn:disabled {
    transform: translateY(3px) rotate(-1deg);
    box-shadow: 0 2px 0 var(--ink);
  }
  .laugh-btn:disabled { background: var(--paper); cursor: default; }
  .laugh-count { font-weight: 700; }
  .laugh-error { margin: 0; font-size: 15px; font-weight: 600; color: var(--error); }

  .top {
    margin-top: 10px;
    padding: 16px 18px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 4px 4px 0 var(--ink);
    transform: rotate(0.6deg);
  }
  .top h2 { margin: 0 0 10px; font-size: 22px; font-weight: 700; text-align: center; }
  .top ol { margin: 0; padding-inline-start: 24px; display: flex; flex-direction: column; gap: 12px; }
  .top-text { display: block; font: 500 18px/1.5 var(--hand); overflow-wrap: anywhere; }
  .top-laughs { display: block; font-size: 14px; font-weight: 600; color: var(--ink-soft); }

  footer {
    margin-top: 6px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo.svg" alt="בדיחה בלחיצה">
  <p class="intro">כותבים נושא, לוחצים, וצוחקים. בלי נושא, מקבלים בדיחה כללית.</p>

  <form id="form">
    <label for="topic">על מה הבדיחה?</label>
    <input id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים" autocomplete="off">
    <button id="go" type="submit">תנו לי בדיחה!</button>
  </form>

  <section class="bubble" id="bubble" data-state="idle">
    <img class="mascot mascot-idle" src="assets/mascot-idle.svg" alt="">
    <img class="mascot mascot-think" src="assets/mascot-think.svg" alt="">
    <img class="mascot mascot-joke" src="assets/mascot-joke.svg" alt="">
    <img class="mascot mascot-error" src="assets/mascot-error.svg" alt="">
    <p id="msg" aria-live="polite">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
    <button class="laugh-btn" id="laugh" type="button" hidden>צחקתי <span class="laugh-count" id="laugh-count">0</span></button>
    <p class="laugh-error" id="laugh-error" role="status" hidden></p>
  </section>

  <section class="top" id="top" hidden>
    <h2>הכי מצחיקות</h2>
    <ol id="top-list"></ol>
  </section>

  <footer>מיישם AI ואוטומציה · 53500</footer>
</main>

<script>
  const form = document.getElementById("form");
  const topicInput = document.getElementById("topic");
  const go = document.getElementById("go");
  const bubble = document.getElementById("bubble");
  const msg = document.getElementById("msg");
  const laugh = document.getElementById("laugh");
  const laughCount = document.getElementById("laugh-count");
  const laughError = document.getElementById("laugh-error");
  const topSection = document.getElementById("top");
  const topList = document.getElementById("top-list");

  let currentJokeId = null;
  let topRequest = 0;

  function setState(state, text, label, jokeId = null) {
    bubble.dataset.state = state;
    msg.textContent = text;
    go.textContent = label;
    go.disabled = state === "think";

    // A joke that was not saved has no id, so there is nothing to count.
    currentJokeId = jokeId;
    laugh.hidden = !jokeId;
    laugh.disabled = false;
    laughCount.textContent = "0";
    laughError.hidden = true;
  }

  function renderTop(jokes) {
    topList.replaceChildren(...jokes.map((joke) => {
      const item = document.createElement("li");
      const text = document.createElement("span");
      text.className = "top-text";
      text.textContent = joke.text;
      const laughs = document.createElement("span");
      laughs.className = "top-laughs";
      laughs.textContent = joke.laughs === 1 ? "צחוק אחד" : `${joke.laughs} צחוקים`;
      item.append(text, laughs);
      return item;
    }));
    topSection.hidden = jokes.length === 0;
  }

  async function loadTop() {
    const request = ++topRequest;
    try {
      const res = await fetch("/api/top");
      const data = await res.json();
      if (request === topRequest && res.ok && Array.isArray(data.top)) renderTop(data.top);
    } catch (err) {
      console.error(err);
    }
  }

  laugh.addEventListener("click", async () => {
    const id = currentJokeId;
    laugh.disabled = true;
    laughError.hidden = true;

    let laughs = null;
    let problem = "לא הצלחנו לספור את הצחוק. נסו שוב.";
    try {
      const res = await fetch("/api/laugh", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id }),
      });
      const data = await res.json();
      if (res.ok && Number.isInteger(data.laughs)) laughs = data.laughs;
      else if (typeof data.error === "string" && data.error) problem = data.error;
    } catch (err) {
      console.error(err);
    }

    // The user may have moved on to a new joke while this was in flight.
    if (id === currentJokeId) {
      if (laughs === null) {
        laugh.disabled = false;
        laughError.textContent = problem;
        laughError.hidden = false;
      } else {
        laughCount.textContent = String(laughs);
      }
    }
    if (laughs !== null) loadTop();
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const topic = topicInput.value.trim().slice(0, 100);

    setState("think", topic ? `מחפש בדיחה על ${topic}...` : "מחפש בדיחה...", "חושב...");

    try {
      const res = await fetch("/api/joke", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic }),
      });
      const data = await res.json();
      if (res.ok && typeof data.joke === "string") {
        setState("joke", data.joke, "עוד בדיחה!", data.id);
        return;
      }
      const text = typeof data.error === "string" && data.error ? data.error : "משהו השתבש. נסו שוב בעוד רגע.";
      setState("error", text, "לנסות שוב");
    } catch (err) {
      console.error(err);
      setState("error", "משהו השתבש. נסו שוב בעוד רגע.", "לנסות שוב");
    }
  });

  loadTop();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch((err) => console.error(err));
  }
</script>
</body>
</html>
